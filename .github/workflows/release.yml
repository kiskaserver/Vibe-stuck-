name: Release

# Publishes one GitHub Release carrying everything an install needs:
#
#   VibeStack-Atlas-<version>-android.apk      phone build
#   VibeStack-Atlas-<version>-windows-x64.zip  desktop builds
#   VibeStack-Atlas-<version>-linux-x64.tar.gz
#   VibeStack-Atlas-<version>-macos.dmg
#   catalog.db.gz                              the catalog itself
#   manifest.json                              what installed apps read first
#
# The last two are what makes the catalog updatable without reinstalling: an
# app checks `releases/latest/download/manifest.json`, compares the version
# with its own, and pulls the database only when there is a newer one.
#
# Actions are pinned to full commit SHAs. Flutter comes from a container image
# on Linux and from a shallow clone on Windows and macOS, so no marketplace
# action provides the toolchain — a pinning requirement applies transitively,
# and an action that caches through an unpinned action fails under it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (must already exist)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FLUTTER_CHANNEL: stable

jobs:
  catalog:
    name: Catalog assets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.catalog }}
      app_version: ${{ steps.build.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Signing is optional and fails loudly rather than silently: if the app
      # has a public key compiled in but the secret is missing, every install
      # would reject the release, so it is better not to publish one.
      - name: Check the signing key
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -f data/release-key.pub ] && [ -z "${CATALOG_SIGNING_KEY:-}" ]; then
            echo "::error::data/release-key.pub is committed but CATALOG_SIGNING_KEY is not set — apps built from this commit would refuse this release"
            exit 1
          fi
          if [ -n "${CATALOG_SIGNING_KEY:-}" ]; then
            pip install --quiet cryptography
            python tool/release_key.py check "$CATALOG_SIGNING_KEY"
          else
            echo "::notice::No signing key configured; the release will be unsigned."
          fi

      - name: Build the catalog and its manifest
        id: build
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/download/${TAG}/catalog.db.gz"
          sign=""
          [ -n "${CATALOG_SIGNING_KEY:-}" ] && sign="--sign"
          python tool/build_catalog.py --release --download-url "$url" $sign
          python tool/verify_catalog.py
          echo "catalog=$(python -c "import json;print(json.load(open('dist/manifest.json'))['catalogVersion'])")" >> "$GITHUB_OUTPUT"
          echo "app=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      # A tag whose generated Dart was never rebuilt would publish an app whose
      # category labels disagree with the catalog shipped beside it.
      - name: Tagged artifacts must match the sources
        run: git diff --exit-code -- lib/i18n/categories.dart lib/app_info.dart

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog
          path: dist/*
          if-no-files-found: error

  # Android and Linux build inside the Flutter image, which already carries the
  # Android SDK and its accepted licences.
  linux:
    name: ${{ matrix.target }}
    needs: catalog
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:stable
    strategy:
      fail-fast: false
      matrix:
        target: [android, linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - name: Install build dependencies
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 libsqlite3-0
          if [ "${{ matrix.target }}" = "linux" ]; then
            apt-get install -y -qq --no-install-recommends \
              clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          fi

      # assets/catalog.db is a build artifact, not a checked-in file. The same
      # sources produce it here as produced the release assets in the catalog
      # job, so what ships inside the app and what ships next to it agree.
      - name: Build the catalog
        run: python3 tool/build_catalog.py

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate platform runner
        run: flutter create --project-name vibestack_atlas --platforms=${{ matrix.target }} .

      - name: Configure platform runner
        run: dart run tool/post_create.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build
        run: flutter build ${{ matrix.target == 'android' && 'apk' || 'linux' }} --release

      - name: Package
        run: |
          set -eu
          version="${{ needs.catalog.outputs.app_version }}"
          if [ "${{ matrix.target }}" = "android" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk \
               "VibeStack-Atlas-${version}-android.apk"
          else
            tar -czf "VibeStack-Atlas-${version}-linux-x64.tar.gz" \
              -C build/linux/x64/release/bundle .
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-${{ matrix.target }}
          path: |
            VibeStack-Atlas-*.apk
            VibeStack-Atlas-*.tar.gz
          if-no-files-found: error

  # Windows and macOS cannot use the container, so the SDK is cloned. Slower
  # than a caching action and beholden to nothing.
  desktop:
    name: ${{ matrix.target }}
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the catalog
        run: python tool/build_catalog.py

      - name: Install Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_CHANNEL" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Report the toolchain
        run: flutter --version

      - name: Generate platform runner
        run: flutter create --project-name vibestack_atlas --platforms=${{ matrix.target }} .

      - name: Configure platform runner
        run: dart run tool/post_create.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build
        run: flutter build ${{ matrix.target }} --release

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*"
          -DestinationPath "VibeStack-Atlas-${{ needs.catalog.outputs.app_version }}-windows-x64.zip"

      # A DMG is what macOS users expect; a directory of loose files is not.
      - name: Package macOS
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no .app bundle found"; exit 1; }
          out="VibeStack-Atlas-${{ needs.catalog.outputs.app_version }}-macos.dmg"
          brew install create-dmg
          create-dmg --volname "VibeStack Atlas" --window-size 540 380 \
            --icon-size 96 --app-drop-link 380 180 "$out" "$app" \
          || hdiutil create -volname "VibeStack Atlas" -srcfolder "$app" -ov -format UDZO "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-${{ matrix.target }}
          path: |
            VibeStack-Atlas-*.zip
            VibeStack-Atlas-*.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [catalog, linux, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release

      # Release notes name the catalog explicitly: an install decides whether
      # to download 800 KB based on this version, so it belongs where a person
      # can read it too.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          App ${{ needs.catalog.outputs.app_version }} · catalog ${{ needs.catalog.outputs.version }}

          Installed apps pick the catalog up on their next daily check; there is
          nothing to reinstall. Platform builds are attached below.

          \`catalog.db.gz\` and \`manifest.json\` are the catalog itself — the app
          reads the manifest, checks the SHA-256, and swaps the database in.
          EOF
          )
          gh release create "$TAG" release/* \
            --title "VibeStack Atlas ${{ needs.catalog.outputs.app_version }}" \
            --notes "$notes" \
            --verify-tag \
          || gh release upload "$TAG" release/* --clobber

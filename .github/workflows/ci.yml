name: CI

# Runs on every pull request and every push to the default branch.
#
# Two independent gates. The catalog gate needs only Python, so a data-only
# change gets an answer in seconds; the app gate needs the Flutter SDK.
#
# Every action is pinned to a full commit SHA. Repositories can require that,
# and the requirement is transitive: an action that calls an unpinned action
# is rejected too. That is why the Flutter SDK comes from a container image
# here rather than from a marketplace action — and the same image runs this
# pipeline on Codeberg, so both CIs test the app in one environment.

on:
  pull_request:
  push:
    branches: [vibe-atlas]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the catalog
        run: python tool/build_catalog.py

      - name: Verify the contract
        run: python tool/verify_catalog.py

      # The database is a build artifact and is not committed, but the
      # generated Dart is — it has to compile. An entry edited without a
      # rebuild would otherwise ship category labels that disagree with the
      # entries using them.
      - name: Generated Dart must match the sources
        run: |
          if ! git diff --exit-code -- lib/i18n/categories.dart lib/app_info.dart; then
            echo "::error::Generated files are stale. Run: python3 tool/build_catalog.py"
            exit 1
          fi

  app:
    name: Analyze and test
    runs-on: ubuntu-latest
    # Flutter and the Android SDK come preinstalled; nothing here installs a
    # toolchain at run time.
    container: ghcr.io/cirruslabs/flutter:stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # python3 builds the catalog — assets/catalog.db is generated, not
      # checked out, and nothing below works without it. libsqlite3-0 is what
      # `flutter test` opens it with: the tests run on the host VM, where the
      # native library comes from the system rather than from
      # sqlite3_flutter_libs, and without it they would skip themselves
      # instead of failing, which is a silently empty gate.
      - name: Install Python and native SQLite
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 libsqlite3-0

      - name: Build the catalog
        run: python3 tool/build_catalog.py

      # The container clones as a different user than the checkout ran as.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # No platform runner is committed; it is generated from the Flutter
      # version in the image instead of frozen in the repository.
      - name: Generate platform runner
        run: flutter create --project-name vibestack_atlas --platforms=linux .

      - name: Configure platform runner
        run: dart run tool/post_create.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
